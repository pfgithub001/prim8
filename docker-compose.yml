# On Coolify, name and container_name are rewritten (resource UUID, <service>-<uuid>-<timestamp>)
# and the `default` network is replaced by a UUID network. Named networks like `prim8` below are
# kept, so the container ends up on both: prim8-network (fixed subnet) and Coolify's UUID network.
name: ${PROJECT_NAME:-prim8}

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  nextjs:
    <<: *defaults
    build: ./prim8-nextjs
    image: ${PROJECT_NAME:-prim8}-nextjs
    container_name: ${PROJECT_NAME:-prim8}-nextjs
    # App vars: from prim8-nextjs/.env locally; on a deploy platform that clones from git
    # (e.g. Coolify) that file is absent and the vars come from the root .env it generates.
    # Later files win, so locally the app's own .env takes precedence.
    env_file:
      - path: ./.env
        required: false
      - path: ./prim8-nextjs/.env
        required: false
    # Pinned here because `environment` beats env_file and the platform's .env: Next's standalone
    # server binds to HOSTNAME:PORT, and the image healthcheck probes 127.0.0.1:3000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # Not published on the host: the platform proxy (Coolify's Traefik) reaches it over the network
    expose:
      - "3000"
    networks:
      - prim8

networks:
  prim8:
    name: ${PROJECT_NAME:-prim8}-network
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.0.10.0/24}
