name: ${PROJECT_NAME:-prim8}

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  nextjs:
    <<: *defaults
    build: ./prim8-nextjs
    image: ${PROJECT_NAME:-prim8}-nextjs
    container_name: ${PROJECT_NAME:-prim8}-nextjs
    # App vars: from prim8-nextjs/.env locally; on a deploy platform that clones from git
    # (e.g. Coolify) that file is absent and the vars come from the root .env it generates.
    # Later files win, so locally the app's own .env takes precedence.
    env_file:
      - path: ./.env
        required: false
      - path: ./prim8-nextjs/.env
        required: false
    # Not published on the host: the platform proxy (Coolify's Traefik) reaches it over the network
    expose:
      - "3000"

networks:
  default:
    name: ${PROJECT_NAME:-prim8}-network
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.29.0.0/16}
